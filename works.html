<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Works — Hill Noriko</title>
  <meta name="description" content="Hill Noriko｜UI/UX Designer / Visual Designer の制作実績">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="color-scheme" content="dark">
  <!-- CSSより先に背景を暗くして、ページ切り替え時の白い光りを防ぐ -->
  <style>html, body { background: #07090c; }</style>
  <!-- ヘッダーのセリフ体は読み込み完了まで待って表示（代替フォントからの差し替えで文字がズレないように） -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=block" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=61">
  <!-- 効果の初期状態をちらつきなく反映 -->
  <script>
    (function () {
      var on = true;
      try {
        var saved = localStorage.getItem("hn-effect");
        if (saved !== null) on = saved === "1";
        else if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) on = false;
      } catch (e) {}
      document.documentElement.classList.add(on ? "fx-on" : "fx-off");
    })();
  </script>
</head>
<body class="page-works">
  <canvas id="water-bg" class="water-bg" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="site-header__left">
      <a class="site-name" href="index.html" data-bind="name">Hill Noriko</a>
      <nav class="site-nav" aria-label="メイン">
        <a href="works.html" aria-current="page">works</a>
        <a href="history.html">history</a>
      </nav>
    </div>
    <div class="site-header__right">
      <button type="button" class="switch" id="fx-switch" aria-pressed="true">
        <span class="switch__label">Effect</span>
        <span class="switch__state"></span>
      </button>
    </div>
  </header>

  <main class="works">
    <h1 class="visually-hidden">Works</h1>
    <div class="tabs" id="works-tabs" role="tablist" aria-label="カテゴリ"></div>
    <ul class="works__grid" id="works-grid" role="tabpanel"></ul>
  </main>

  <script src="data/site.js?v=61"></script>
  <script src="data/works.js?v=61"></script>
  <script src="assets/js/water.js?v=61"></script>
  <script src="assets/js/ink.js?v=61"></script>
  <script src="assets/js/common.js?v=61"></script>
  <script src="assets/js/works-page.js?v=61"></script>
</body>
</html>
